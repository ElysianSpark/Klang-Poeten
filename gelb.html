<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klang-Poeten | GELB</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #DFDF41;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    main {
      width: min(900px, 95vw);
    }

    h1 {
      margin: 0 0 60px 0;
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: -0.06em;
      text-align: center;
      color: rgba(26, 26, 26, 0.85);
    }

    /* 3x3 Grid für die Farbquadrate */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      max-width: 700px;
      margin: 0 auto 80px;
    }

    .color-square {
      aspect-ratio: 1;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 0.75rem;
      font-weight: bold;
      color: rgba(26, 26, 26, 0.8);
      letter-spacing: 0.05em;
      border-radius: 4px;
    }

    .color-square:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* Farben für GELB-Seite: Rot, Blau, Violett (Komplementär), Orange, Grün, Cyan, etc. */
    .square-1 { background-color: #D94141; } /* Rot entsättigt */
    .square-2 { background-color: #D9845A; } /* Rot-Orange Mix */
    .square-3 { background-color: #C98B6B; } /* Orange entsättigt */
    
    .square-4 { background-color: #9B8B7A; } /* Beige-neutral */
    .square-5 { background-color: #7A6B9B; } /* Violett entsättigt (Komplementär zu Gelb) */
    .square-6 { background-color: #7A8B8B; } /* Grau-Grün */
    
    .square-7 { background-color: #6B9B8B; } /* Cyan-Grün */
    .square-8 { background-color: #5A7A9B; } /* Blauviolett */
    .square-9 { background-color: #4141D9; } /* Blau entsättigt */

    .back-link {
      position: fixed;
      top: 30px;
      left: 30px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: rgba(26, 26, 26, 1);
    }

    @media (max-width: 600px) {
      .color-grid {
        gap: 20px;
      }

      .back-link {
        top: 20px;
        left: 20px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-link">← Zurück</a>

  <main>
    <h1>GELB</h1>

    <div class="color-grid">
      <a href="audio-gelb-1.html" class="color-square square-1"></a>
      <a href="audio-gelb-2.html" class="color-square square-2"></a>
      <a href="audio-gelb-3.html" class="color-square square-3"></a>

      <a href="audio-gelb-4.html" class="color-square square-4"></a>
      <a href="audio-gelb-5.html" class="color-square square-5"></a>
      <a href="audio-gelb-6.html" class="color-square square-6"></a>

      <a href="audio-gelb-7.html" class="color-square square-7"></a>
      <a href="audio-gelb-8.html" class="color-square square-8"></a>
      <a href="audio-gelb-9.html" class="color-square square-9"></a>
    </div>
  </main>

</body>
</html>
