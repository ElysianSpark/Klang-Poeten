<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klang-Poeten</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #403b55 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #3a4a50 0%, transparent 30%),
        #111214;
      color: #f3f1ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(900px, 90vw);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 300;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    .line {
      width: 70px;
      height: 1px;
      background: #f3f1ec;
      margin: 40px auto 30px;
      opacity: 0.6;
    }

    p {
      max-width: 520px;
      margin: 0 auto 80px;
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 300;
      color: #d0cdc7;
    }

    .color-squares {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      margin-bottom: 100px;
    }

    .square {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      color: rgba(17, 18, 20, 0.8);
      letter-spacing: 0.05em;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-radius: 4px;
    }

    .square:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .square-red { background-color: #D94141; }
    .square-yellow { background-color: #DFDF41; }
    .square-blue { background-color: #4141D9; }

    footer {
      position: fixed;
      left: 6vw;
      right: 6vw;
      bottom: 28px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8e8e8e;
    }

    @media (max-width: 600px) {
      .color-squares { gap: 20px; }
      .square { width: 150px; height: 150px; }
      footer {
        position: static;
        margin-top: 80px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Klang-Poeten</h1>
    <div class="line"></div>
    <p>Audiovisuelle Kunst</p>

    <div class="color-squares">
      <a href="rot.html" class="square square-red">ROT</a>
      <a href="gelb.html" class="square square-yellow">GELB</a>
      <a href="blau.html" class="square square-blue">BLAU</a>
    </div>
  </main>

  <footer>
    <span>Berlin · Brandenburg</span>
    <span>Website im Aufbau</span>
  </footer>
</body>
</html>
