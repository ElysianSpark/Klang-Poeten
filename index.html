<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klang-Poeten</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #403b55 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #3a4a50 0%, transparent 30%),

      color: #f3f1ec;
      min-height: 100vh;
      display: flex;

      justify-content: flex-start;
    }
    main {
      width: min(900px, 88vw);

      margin-left: 6vw;
    }
    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 300;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }
    .line {
      width: 70px;
      height: 1px;
      background: #f3f1ec;
      margin: 40px 0 30px;
      opacity: 0.6;
    }
    p {
      max-width: 520px;
      margin: 0 0 60px;
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 300;
      color: #d0cdc7;
    }
    .color-squares {
      display: flex;
      justify-content: flex-start;
      gap: 30px;
      flex-wrap: wrap;
    }
    .square {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 4px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 93px;
      font-color: white;
    }
    .square a { color: white; }` 
    .squre a:hover { color: lightgrey; }
    
    .square:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    .square-red { background-color: #B85A5A; }
    .square-yellow { background-color: #B8B85A; }
    .square-blue { background-color: #5A5AB8; }
    footer {
      position: fixed;
      bottom: 28px;
      left: 6vw;
      right: 6vw;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8e8e8e;
    }
    @media (max-width: 600px) {
      main { margin-left: 0; width: min(90vw, 900px); }
      .color-squares { justify-content: center; }
      .square { width: 140px; height: 140px; }

    <div class="color-squares">
