<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klang-Poeten</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&amp;display=swap">
  <style>
    @font-face {
      font-family: 'KP Helvetica Light';
      src: local('HelveticaNeue-Light'), local('Helvetica Neue Light');
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #403b55 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #3a4a50 0%, transparent 30%),
        #111214;
      color: #f3f1ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    main {
      width: min(900px, 88vw);
      padding-top: 8vh;
      margin-left: 6vw;
    }
    h1 {
      margin: 0;
      font-family: 'KP Helvetica Light', 'Roboto', Arial, sans-serif;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 300;
      letter-spacing: 0.015em;
      line-height: 0.9;
    }
    .line {
      width: 70px;
      height: 1px;
      background: #f3f1ec;
      margin: 40px 0 30px;
      opacity: 0.6;
    }
    p {
      max-width: 520px;
      margin: 0 0 60px;
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 300;
      color: #d0cdc7;
    }
    .color-squares {
      display: flex;
      justify-content: flex-start;
      gap: 30px;
      flex-wrap: wrap;
    }
    .square {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 4px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 93px;
      color: #ffffff;
    }
    .square:visited { color: #ffffff; }
    
    .square:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    .square-red { background-color: #B85A5A; }
    .square-yellow { background-color: #B8B85A; }
    .square-blue { background-color: #5A5AB8; }
    .square-video { background-color: #707070; }
    .square-video:focus-visible { outline: 2px solid #f3f1ec; outline-offset: 6px; }
    footer {
      position: fixed;
      bottom: 28px;
      left: 6vw;
      right: 6vw;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8e8e8e;
    }
    .contact {
      margin: 40px 0 80px;
      font-size: 1rem;
    }
    .contact a {
      color: #d0cdc7;
      text-decoration: underline;
      text-underline-offset: 0.2em;
      overflow-wrap: anywhere;
    }
    .contact a:hover,
    .contact a:focus-visible { color: #f3f1ec; }
    @media (max-width: 600px) {
      h1 { font-size: clamp(2rem, 12vw, 4.5rem); }
      main { margin-left: 0; width: min(90vw, 900px); }
      .color-squares { justify-content: center; }
      .square { width: 140px; height: 140px; }
      footer { position: static; margin-top: 80px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Klang-Poeten</h1>
    <div class="line"></div>
    <p>Audiovisuelle Kunst</p>

    <div class="color-squares">
      <a href="01_Wuerfel-Klang/Wurfel1/pi.html" class="square square-red" aria-label="Rote Klangseite">1</a>
      <a href="01_Wuerfel-Klang/Wurfel2/pi.html" class="square square-yellow" aria-label="Gelbe Klangseite">2</a>
      <a href="01_Wuerfel-Klang/Wurfel3/pi.html" class="square square-blue" aria-label="Blaue Klangseite">3</a>
      <a href="filme.html" class="square square-video" aria-label="Filme ansehen">4</a>
    </div>

    <p class="contact"><a href="mailto:werkstatt@klang-poeten.de">werkstatt@klang-poeten.de</a></p>
  </main>

  <footer>
    <span>Berlin · Brandenburg</span>
  </footer>

</body>
</html>
